worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile      on;
    server_tokens off;

    # Rate limit keyed on client address, sized for roughly 160k addresses.
    #
    # The brief has no brute-force protection anywhere, and login is the one
    # endpoint where guessing pays. Five attempts a minute is generous for a
    # human and useless for a dictionary attack. Enforcing it here rather than
    # in Go keeps the flood off the application and the database entirely.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    upstream app {
        server app:8000;
        keepalive 16;
    }

    server {
        listen 80;

        # Set once at server level; locations inherit these as long as none of
        # them declares a proxy_set_header of its own.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # A patient search returns JSON, never megabytes of upload.
        client_max_body_size 1m;
        client_body_timeout  10s;
        client_header_timeout 10s;

        location = /staff/login {
            # burst absorbs a legitimate double-submit; nodelay serves those
            # immediately rather than queueing them behind the rate.
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://app;
        }

        location / {
            proxy_pass http://app;
        }
    }
}
